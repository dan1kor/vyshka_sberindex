# Настройки бэктеста прогнозной модели (ноутбук 02_backtest)
seed: 42
data:
  panel: data/processed/panel_mo_month.parquet
  target: y_all
horizons: [1, 3, 6, 12]
horizons_eval: [1, 2, 3, 4, 6, 7, 12]   # 2, 4, 7 — для проверки лага публикации таргета (h+1)
backtest:
  # точки отсечки T: прогноз делается на конец месяца T на T+h
  first_origin: "2024-01-01"
  last_target: "2024-12-01"
  # для h=12 истории хватает только на одно окно: прогноз с конца 2023 на конец 2024
  h12_origin: "2023-12-01"
models:
  prophet:
    sample_n_mo: 400            # Prophet обучается отдельно на каждый МО — берём стратифицированную выборку
    all_mo: true                # плюс полный прогон Prophet по всем МО (долго, с кешем кусками)
    params:
      growth: linear
      yearly_seasonality: auto  # при <2 лет истории Prophet сам отключает годовую сезонность
      weekly_seasonality: false
      daily_seasonality: false
      changepoint_prior_scale: 0.05
    params_tuned:               # усиленный Prophet: годовая сезонность принудительно, мультипликативно
      growth: linear
      yearly_seasonality: false
      yearly_order: 3
      weekly_seasonality: false
      daily_seasonality: false
      seasonality_mode: multiplicative
      changepoint_prior_scale: 0.01
  lightgbm:
    target_transform: log_ratio # учим log(y_{T+h} / y_T): масштаб МО не мешает
    pooled_horizons: [1, 2, 3, 4, 5, 6, 7]  # общая модель: горизонт как признак
    params:
      objective: l1             # оптимизируем MAE напрямую
      learning_rate: 0.05
      n_estimators: 400
      num_leaves: 31
      min_child_samples: 40
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.5
      reg_lambda: 1.0
      verbose: -1
