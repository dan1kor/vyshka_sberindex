# Настройки сборки панели (ноутбук 01_build_panel)
period: {start: "2022-01-01", end: "2024-12-01"}   # 2022 — только история для лагов внешних признаков
target_category: "Все категории"
horizons: [1, 3, 6, 12]
y_lags: [1, 2, 3, 6, 12]
rolling_windows: [3, 6]
# лаг публикации (мес.): через сколько месяцев показатель за месяц m становится известен
pub_lag: {cpi: 1, wage: 2, unemp: 1, loans: 1, key_rate: 0, infl_exp: 1, sber_nat_month: 1, sber_nat_week: 0}
# население: бюллетень на 1 января 2023 г. вышел 31.07.2024, поэтому используем один статичный срез
# (2023) без изменения во времени — меньшая из утечек; изменение населения 2023→2024 не используем
population_year: 2023
size_bins: [0, 10000, 50000, 250000, 1000000, .inf]
size_labels: ["<10k", "10-50k", "50-250k", "250k-1M", ">1M"]
# производственный календарь, рабочие дни при 5-дневке (2024 — сверено с buh.ru; 2022–2023 — официальные нормы)
workdays:
  2022: [16, 19, 22, 21, 18, 21, 21, 23, 22, 21, 21, 22]
  2023: [17, 18, 22, 20, 20, 21, 21, 23, 21, 22, 21, 21]
  2024: [17, 20, 20, 21, 20, 19, 23, 22, 21, 23, 21, 21]
